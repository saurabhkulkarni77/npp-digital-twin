name: Deploy to AWS S3

# Mirrors the HydroTwin dual-deploy pattern. Requires the repository secrets
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (same names as hydrotwin-site).
# The job creates/configures the bucket on first run, then syncs the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: npp-digital-twin-2026
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Ensure website bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          aws s3api put-bucket-website --bucket "$BUCKET" \
            --website-configuration '{"IndexDocument":{"Suffix":"index.html"},"ErrorDocument":{"Key":"index.html"}}'
          cat > /tmp/policy.json <<EOF
          {"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow",
           "Principal":"*","Action":"s3:GetObject",
           "Resource":"arn:aws:s3:::$BUCKET/*"}]}
          EOF
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy file:///tmp/policy.json

      - name: Sync site to S3
        run: |
          aws s3 sync . "s3://$BUCKET/" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --delete

      - name: Publish URL
        run: |
          echo "### NPP Digital Twin on AWS" >> "$GITHUB_STEP_SUMMARY"
          echo "http://$BUCKET.s3-website-$AWS_REGION.amazonaws.com" >> "$GITHUB_STEP_SUMMARY"
